services:

  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: marketplace_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketplace_db"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

  app:
    build: .

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - .:/app
      
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: